components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Year:
      in: query
      name: year
      schema: { type: integer, example: 2026 }
    Month:
      in: query
      name: month
      schema: { type: integer, minimum: 1, maximum: 12, example: 1 }
    Months:
      in: query
      name: months
      description: Defaults to 6 when omitted or non-positive.
      schema: { type: integer, example: 6 }
    Limit:
      in: query
      name: limit
      description: Defaults to 20, capped at 100.
      schema: { type: integer, example: 20 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, default: 0 }
    CategoryIdQuery:
      in: query
      name: category_id
      schema: { type: string, format: uuid }
    From:
      in: query
      name: from
      description: Inclusive start date (YYYY-MM-DD).
      schema: { type: string, format: date }
    To:
      in: query
      name: to
      description: Inclusive end date (YYYY-MM-DD).
      schema: { type: string, format: date }

  responses:
    OK:
      description: success
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: missing, malformed or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: resource not found, or not owned by the current user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: conflicting state (duplicate, already finalized, expired, etc.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: rate limit exceeded, try again later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}
      required: [success]

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
      required: [success, error]

    AuthResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AuthResponse' }

    RegisterResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RegisterResponse' }

    UserResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserResponse' }

    NotificationPreferenceResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NotificationPreferenceResponse' }

    URLEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                url: { type: string, format: uri }

    RegisterRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Alice }
        email: { type: string, format: email, example: alice@example.com }
        password: { type: string, format: password, minLength: 8, example: password123 }
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token: { type: string, description: "Format: <session_id>.<secret>" }
      required: [refresh_token]

    VerifyOTPRequest:
      type: object
      properties:
        email: { type: string, format: email, example: alice@example.com }
        otp: { type: string, minLength: 6, maxLength: 6, example: "042917" }
      required: [email, otp]

    ResendOTPRequest:
      type: object
      properties:
        email: { type: string, format: email }
        purpose: { type: string, enum: [register, reset_password] }
      required: [email, purpose]

    ForgotPasswordRequest:
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        email: { type: string, format: email }
        otp: { type: string, minLength: 6, maxLength: 6, example: "042917" }
        new_password: { type: string, format: password, minLength: 8 }
      required: [email, otp, new_password]

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
      required: [name]

    ChangePasswordRequest:
      type: object
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
      required: [current_password, new_password]

    SendInvitationRequest:
      type: object
      properties:
        receiver_email: { type: string, format: email }
      required: [receiver_email]

    CreateCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Food }
        icon: { type: string, maxLength: 10, example: "🍔" }
      required: [name]

    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, maxLength: 10 }

    CreateBudgetRequest:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        year: { type: integer, example: 2026 }
        month: { type: integer, minimum: 1, maximum: 12 }
        base_amount: { type: integer, format: int64, minimum: 0 }
      required: [category_id, year, month, base_amount]

    UpdateBudgetRequest:
      type: object
      properties:
        base_amount: { type: integer, format: int64, minimum: 0 }
      required: [base_amount]

    CreateExpenseRequest:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        monthly_budget_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 255 }
        expense_date: { type: string, format: date, example: "2026-01-15" }
      required: [category_id, monthly_budget_id, amount, expense_date]

    UpdateExpenseRequest:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 255 }
        expense_date: { type: string, format: date }

    CreateRecurringExpenseRequest:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 255 }
        schedule_type: { type: string, enum: [weekly, monthly] }
        schedule_day:
          type: integer
          description: For weekly, 0-6 (Sunday-Saturday); for monthly, day of month (clamped to the last day when out of range).
      required: [category_id, amount, schedule_type, schedule_day]

    UpdateRecurringExpenseRequest:
      type: object
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 255 }
        schedule_day: { type: integer }

    CreateReminderRequest:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        amount: { type: integer, format: int64, minimum: 1, nullable: true }
        due_date: { type: string, format: date }
        remind_before_days: { type: integer, minimum: 0, description: "Defaults to 1 when omitted." }
      required: [title, due_date]

    UpdateReminderRequest:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        amount: { type: integer, format: int64, minimum: 1, nullable: true }
        due_date: { type: string, format: date }
        remind_before_days: { type: integer, minimum: 0 }

    SnoozeReminderRequest:
      type: object
      properties:
        snoozed_until: { type: string, format: date }
      required: [snoozed_until]

    UpdateNotificationPreferenceRequest:
      type: object
      description: Every field is optional; omit a key to leave that preference unchanged.
      properties:
        budget_alert: { type: boolean, nullable: true }
        partner_activity: { type: boolean, nullable: true }
        weekly_summary: { type: boolean, nullable: true }
        reminder_alert: { type: boolean, nullable: true }
        recurring_alert: { type: boolean, nullable: true }

    CreateExportRequest:
      type: object
      properties:
        format: { type: string, enum: [pdf] }
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        scope: { type: string, enum: [personal, couple] }
      required: [format, year, month, scope]

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: '#/components/schemas/UserResponse' }

    RegisterResponse:
      type: object
      properties:
        email: { type: string, format: email }

    SessionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        last_active_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        is_current: { type: boolean }

    SecurityAuditLog:
      type: object
      description: Serialized with Go's default (PascalCase) field names - this struct has no json tags.
      properties:
        ID: { type: string, format: uuid }
        UserID: { type: string, format: uuid, nullable: true }
        EventType:
          type: string
          enum:
            - register_success
            - login_success
            - login_failure
            - password_changed
            - invitation_sent
            - invitation_accepted
            - invitation_rejected
            - invitation_cancelled
            - partner_linked
            - partner_unlinked
            - session_revoked
            - sessions_revoked_others
        IPAddress: { type: string, nullable: true }
        UserAgent: { type: string, nullable: true }
        Meta: { type: object, additionalProperties: true, nullable: true }
        CreatedAt: { type: string, format: date-time }

    CategoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        created_at: { type: string, format: date-time }

    BudgetResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        year: { type: integer }
        month: { type: integer }
        base_amount: { type: integer, format: int64 }
        rollover_amount: { type: integer, format: int64 }
        total_amount: { type: integer, format: int64 }
        is_finalized: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExpenseResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        monthly_budget_id: { type: string, format: uuid }
        amount: { type: integer, format: int64 }
        note: { type: string }
        expense_date: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    RecurringExpenseResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount: { type: integer, format: int64 }
        note: { type: string }
        schedule_type: { type: string, enum: [weekly, monthly] }
        schedule_day: { type: integer }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    ReminderResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        amount: { type: integer, format: int64, nullable: true }
        due_date: { type: string, format: date-time }
        remind_before_days: { type: integer }
        status: { type: string, enum: [upcoming, overdue, done] }
        snoozed_until: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [recurring_expense, bill_reminder, budget_alert, partner_activity, weekly_summary]
        title: { type: string }
        body: { type: string }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationPreferenceResponse:
      type: object
      properties:
        budget_alert: { type: boolean }
        partner_activity: { type: boolean }
        weekly_summary: { type: boolean }
        reminder_alert: { type: boolean }
        recurring_alert: { type: boolean }

    CoupleResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        partner: { $ref: '#/components/schemas/UserResponse' }
        linked_at: { type: string, format: date-time }

    InvitationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        receiver_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, cancelled, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        sender:
          allOf:
            - $ref: '#/components/schemas/UserResponse'
          description: >-
            Only populated on GET /couples/invitations/incoming — the
            receiver needs to know who sent it, since sender_id alone is
            just an opaque uuid.

    CategorySpend:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        name: { type: string }
        spent: { type: integer, format: int64 }
