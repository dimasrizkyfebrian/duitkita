        month: { type: integer }
        total: { type: integer, format: int64 }

    TrendResponse:
      type: object
      properties:
        points:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }

    ForecastResponse:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        projected_total: { type: integer, format: int64 }
