    MonthlyReportResponse:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        total_spent: { type: integer, format: int64 }
        total_budget: { type: integer, format: int64 }
        by_category:
          type: array
          items: { $ref: '#/components/schemas/CategorySpend' }

    TrendPoint:
      type: object
      properties:
