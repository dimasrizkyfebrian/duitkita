openapi: 3.0.3
info:
  title: Duitkita API
  description: >
    Hand-written OpenAPI spec for the Duitkita Go backend, maintained
    separately from the handler code for manual/exploratory testing via
    Swagger UI.


    To try protected endpoints: call `POST /auth/register` or
    `POST /auth/login` below, copy the `access_token` from the response,
    then click **Authorize** and paste it (without the `Bearer ` prefix).
  version: "1.0.0"
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users
  - name: Couples
  - name: Categories
  - name: Budgets
  - name: Expenses
  - name: Recurring Expenses
  - name: Reminders
  - name: Notifications
  - name: Reports
  - name: Activity
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >
        Creates an unverified account and emails a 6-digit OTP to the given
        address. No tokens are issued yet — call `POST /auth/verify-otp`
        with the code to complete registration and receive tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: registered successfully, otp sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the registration OTP and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOTPRequest' }
      responses:
        '200':
          description: account verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend an OTP for registration or password reset
      description: >
        Always returns 200 even if the email isn't registered, so the
        response can't be used to enumerate accounts. Subject to a
        per-email cooldown (`OTP_RESEND_COOLDOWN_SECONDS`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendOTPRequest' }
      responses:
        '200':
          description: otp resent if the account exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset OTP
      description: Always returns 200 even if the email isn't registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: if the email is registered, a reset code has been sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password using the OTP from /auth/forgot-password
      description: On success, all existing sessions for the user are revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: password reset successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: logged in successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: email not verified yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access/refresh token pair
      description: The refresh token is single-use; each call rotates it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the session tied to the given refresh token
      description: >-
        Idempotent and always returns 200 even if the refresh token is
        malformed, unknown, or already revoked — it never reveals session
        state to the caller. Does not require a valid access token, since the
        access token may already be expired when the user logs out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: logged out successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions for the current user
      responses:
        '200':
          description: sessions retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/others:
    delete:
      tags: [Auth]
      summary: Revoke every session except the current one
      parameters:
        - in: query
          name: current_session_id
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one session by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me:
    get:
      tags: [Users]
      summary: Get the current user's profile
      responses:
        '200':
          description: profile retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload/replace the current user's avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required: [avatar]
      responses:
        '200':
          description: avatar uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      summary: Delete the current user's avatar
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Users]
      summary: Get a signed URL for the current user's avatar
      responses:
        '200':
          description: avatar url retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/URLEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/avatar:
    get:
      tags: [Users]
      summary: Get a signed URL for any user's avatar by id
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: avatar url retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/URLEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/password:
    patch:
      tags: [Users]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/security-audit:
    get:
      tags: [Users]
      summary: List recent security audit log entries for the current user
      responses:
        '200':
          description: security audit retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SecurityAuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/notification-preferences:
    get:
      tags: [Notifications]
      summary: Get the current user's notification preferences
      description: Any key never explicitly saved defaults to enabled.
      responses:
        '200':
          description: preferences retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Notifications]
      summary: Update one or more notification preferences
      description: Only keys present in the body are changed; omit a key to leave it untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferenceRequest' }
      responses:
        '200':
          description: preferences updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /couples/partner:
    get:
      tags: [Couples]
      summary: Get the current user's linked partner
      responses:
        '200':
          description: partner retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CoupleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Couples]
      summary: Unlink from the current partner
      responses:
        '204': { description: unlinked, content: {} }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /couples/invitations:
    post:
      tags: [Couples]
      summary: Send a partner invitation by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendInvitationRequest' }
      responses:
        '201':
          description: invitation sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InvitationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /couples/invitations/incoming:
    get:
      tags: [Couples]
      summary: List pending invitations sent to the current user
      responses:
        '200':
          description: incoming invitations retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InvitationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /couples/invitations/{id}/accept:
    post:
      tags: [Couples]
      summary: Accept a pending invitation, creating the couple link
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: invitation accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CoupleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /couples/invitations/{id}/reject:
    post:
      tags: [Couples]
      summary: Reject a pending invitation
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /couples/invitations/{id}/cancel:
    post:
      tags: [Couples]
      summary: Cancel an invitation you sent
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories:
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: category created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Categories]
      summary: List the current user's categories
      responses:
        '200':
          description: categories retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories/partner:
    get:
      tags: [Categories]
      summary: List the linked partner's categories
      description: >-
        Read-only — categories are strictly per-user, there's no shared/merged
        category set between partners. Lets the client resolve a category
        name/icon for an expense returned by GET /expenses/partner, which
        otherwise only carries a category_id the caller doesn't own.
      responses:
        '200':
          description: partner categories retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get one category by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: category retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Categories]
      summary: Update a category
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: category updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Categories]
      summary: Delete a category
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: deleted, content: {} }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /budgets:
    post:
      tags: [Budgets]
      summary: Create a monthly budget for a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBudgetRequest' }
      responses:
        '201':
          description: budget created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Budgets]
      summary: List the current user's budgets for a period
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: budgets retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BudgetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /budgets/partner:
    get:
      tags: [Budgets]
      summary: List the linked partner's budgets for a period
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: partner budgets retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BudgetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /budgets/finalize:
    post:
      tags: [Budgets]
      summary: Finalize a budget by id (query param, not path)
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: budget finalized
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /budgets/{id}:
    get:
      tags: [Budgets]
      summary: Get one budget by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: budget retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BudgetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Budgets]
      summary: Update a budget's base amount
      description: Rejected with 409 once the budget has been finalized.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBudgetRequest' }
      responses:
        '200':
          description: budget updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BudgetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Budgets]
      summary: Delete a budget
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: deleted, content: {} }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /expenses:
    post:
      tags: [Expenses]
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExpenseRequest' }
      responses:
        '201':
          description: expense created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpenseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Expenses]
      summary: List the current user's expenses
      parameters:
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: expenses retrieved
          content:
            application/json:
              schema:
                allOf:
