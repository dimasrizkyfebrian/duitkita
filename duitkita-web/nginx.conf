server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The PWA service worker and its manifest must always be revalidated,
    # or clients get stuck on a stale app shell after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: let Vue Router handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
