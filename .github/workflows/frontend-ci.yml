name: Frontend CI

on:
  push:
    paths:
      - "duitkita-web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "duitkita-web/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: duitkita-web

jobs:
  build-and-test:
    name: Type-check, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duitkita-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Not `npm run lint` — that script runs with --fix, which would mutate
      # files and still exit 0. CI should fail on violations, not silently
      # patch them.
      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - name: Check formatting (prettier)
        run: npx prettier --check --experimental-cli src/

      - name: Build (includes type-check)
        run: npm run build

      - name: Test
        run: npx vitest run
